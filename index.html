<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Расчёт минимальной инвестиции</title>
<style>
  :root {
    --graphite: #2b2d31;
    --text: #1d1f23;
    --muted: #6b7078;
    --line: #e6e8ec;
    --soft: #f6f7f9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #ffffff;
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  .page { max-width: 760px; margin: 0 auto; padding: 56px 24px 80px; }

  .page-title { font-size: 28px; font-weight: 700; margin: 0 0 6px; color: var(--graphite); }
  .page-sub { font-size: 14px; color: var(--muted); margin: 0 0 40px; }

  .block { margin-bottom: 40px; }
  .block-head {
    background: var(--graphite);
    color: #ffffff;
    padding: 16px 22px;
    border-radius: 12px 12px 0 0;
    display: flex; align-items: baseline; gap: 14px;
  }
  .block-num { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; opacity: .65; white-space: nowrap; }
  .block-title { font-size: 20px; font-weight: 600; margin: 0; }

  .block-body {
    border: 1px solid var(--line);
    border-top: none;
    border-radius: 0 0 12px 12px;
    padding: 24px 22px 22px;
  }

  .price-row { display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px 16px; margin-bottom: 18px; }
  .price-row.last { margin-bottom: 0; }
  .price-main { font-size: 34px; font-weight: 700; color: var(--graphite); }
  .price-rub { font-size: 18px; color: var(--muted); }

  .items { list-style: none; margin: 0 0 18px; padding: 0; }
  .items li {
    display: flex; justify-content: space-between; gap: 16px;
    padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px;
  }
  .items li:last-child { border-bottom: none; }
  .items .val { font-weight: 600; text-align: right; }

  .formula {
    background: var(--soft); border-radius: 8px; padding: 12px 14px;
    font-size: 15px; margin-bottom: 14px;
  }

  .why {
    font-size: 12px; color: var(--muted);
    background: var(--soft); border-left: 3px solid var(--line);
    border-radius: 4px; padding: 10px 12px; line-height: 1.55;
  }

  /* Особая плавающая карточка */
  .float-wrap { padding: 44px 0 56px; }
  .float-card {
    position: relative;
    border-radius: 14px;
    padding: 2px;
    background: linear-gradient(135deg, #2b2d31, #8a93a3, #2b2d31);
    background-size: 200% 200%;
    box-shadow: 0 14px 30px rgba(43, 45, 49, .18);
    animation: floaty 5s ease-in-out infinite, shimmer 8s ease-in-out infinite;
  }
  .float-card .block { margin: 0; background: #fff; border-radius: 12px; overflow: hidden; position: relative; z-index: 2; }
  .float-card .block-head { border-radius: 0; }
  .float-card .block-body { border: none; border-radius: 0; }
  @keyframes floaty {
    0%, 100% { transform: translateY(0); box-shadow: 0 14px 30px rgba(43, 45, 49, .18); }
    50%      { transform: translateY(-7px); box-shadow: 0 22px 36px rgba(43, 45, 49, .14); }
  }
  @keyframes shimmer {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }

  .chip {
    position: absolute; left: 0; top: 0;
    width: 44px; height: 44px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 6px 16px rgba(43, 45, 49, .22);
    display: flex; align-items: center; justify-content: center;
    z-index: 1;
    pointer-events: none;
    will-change: transform;
  }
  .chip svg { width: 26px; height: 26px; display: block; }

  .total {
    border-top: 2px solid var(--graphite);
    padding-top: 22px; margin-top: 8px;
  }
  .total-row { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 6px 0; font-size: 15px; }
  .total-final {
    display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
    margin-top: 12px; padding: 18px 22px;
    background: var(--graphite); color: #fff; border-radius: 12px;
  }
  .total-final .label { font-size: 16px; }
  .total-final .sum { font-size: 30px; font-weight: 700; white-space: nowrap; }
  .note { font-size: 12px; color: var(--muted); margin-top: 14px; }

  /* Что вы получаете */
  .gain { margin-top: 48px; }
  .gain-head {
    background: var(--graphite); color: #fff;
    padding: 16px 22px; border-radius: 12px 12px 0 0;
    font-size: 20px; font-weight: 600; margin: 0;
  }
  .gain-body {
    border: 1px solid var(--line); border-top: none;
    border-radius: 0 0 12px 12px; padding: 28px 22px 24px;
  }
  .gain-big { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 14px; margin-bottom: 20px; }
  .gain-num-wrap { position: relative; padding: 22px 40px; }
  .gain-num { font-size: 64px; font-weight: 800; color: var(--graphite); line-height: 1; position: relative; }
  .gain-small { font-size: 14px; color: var(--muted); }
  .gain-text { font-size: 16px; line-height: 1.6; margin: 0 0 14px; color: var(--text); }

  .gain-extra {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    border: 1px solid var(--line); border-radius: 12px;
    padding: 16px 18px; margin-bottom: 22px;
  }
  .gain-extra-num { font-size: 44px; font-weight: 800; color: var(--graphite); line-height: 1; }
  .gain-extra-num small { font-size: 16px; font-weight: 600; color: var(--muted); margin-left: 6px; }
  .gain-extra-text { font-size: 15px; line-height: 1.55; color: var(--text); flex: 1; min-width: 220px; }

  .star {
    position: absolute;
    width: var(--s, 18px); height: var(--s, 18px);
    animation: twinkle var(--d, 2.4s) ease-in-out infinite;
    animation-delay: var(--delay, 0s);
    transform-origin: center;
  }
  @keyframes twinkle {
    0%, 100% { transform: scale(.55) rotate(0deg);  opacity: .55; }
    50%      { transform: scale(1.15) rotate(20deg); opacity: 1; }
  }

  .admin-note {
    font-size: 15px; line-height: 1.6;
    background: var(--soft); border-left: 3px solid var(--graphite);
    border-radius: 4px; padding: 12px 14px; margin: 0;
  }

  /* ===== Калькулятор ===== */
  .calc-wrap { margin-top: 56px; }
  .calc h3 { font-size: 16px; margin: 30px 0 12px; color: var(--graphite); }
  .calc h3:first-child { margin-top: 0; }
